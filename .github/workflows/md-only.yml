name: md-only

on:
  pull_request:
    branches: [main]

jobs:
  md-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any file that is not Markdown
        run: |
          bad=$(git ls-files | grep -v -E '\.md$' | grep -v -E '^\.github/' || true)
          if [ -n "$bad" ]; then
            echo "Non-Markdown files found:"
            echo "$bad"
            exit 1
          fi
